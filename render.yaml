# GlobeTrotter — Complete Render Production Blueprint
# Deploys: Render Static Site (Frontend) + Render Web Service (Django Backend) + Render PostgreSQL

databases:
  - name: globetrotter-db
    databaseName: globetrotter
    user: globetrotter_user
    plan: free

services:
  # ── Django Backend Web Service ──────────────────────────────
  - type: web
    name: globetrotter-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    preDeployCommand: "python manage.py migrate --noinput"
    startCommand: "python manage.py migrate --noinput && python manage.py seed_data && gunicorn config.wsgi:application"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: globetrotter-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://globetrotter-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://globetrotter-frontend.onrender.com"
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "60"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"

  # ── React + Vite Frontend Static Site ─────────────────────────
  - type: web
    name: globetrotter-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://globetrotter-backend.onrender.com/api/v1"
