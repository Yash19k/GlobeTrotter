name: GlobeTrotter CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Regression & PostgreSQL Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: globetrotter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django system check & PostgreSQL migrations
        env:
          DATABASE_NAME: globetrotter
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgrespassword
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DJANGO_SECRET_KEY: ci-secret-key-testing-only-12345
          DJANGO_DEBUG: "True"
        run: |
          cd backend
          python manage.py check
          python manage.py migrate

      - name: Execute 91 backend unit & security tests
        env:
          DATABASE_NAME: globetrotter
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgrespassword
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DJANGO_SECRET_KEY: ci-secret-key-testing-only-12345
          DJANGO_DEBUG: "True"
        run: |
          cd backend
          python manage.py test tests

  frontend-tests-and-build:
    name: Frontend Vitest, TypeScript & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript type check
        run: |
          cd frontend
          npx tsc -b --noEmit

      - name: Run Vitest unit tests
        run: |
          cd frontend
          npm run test

      - name: Build production Vite bundle
        run: |
          cd frontend
          npm run build
